[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "RUF"]
# Broad except blocks are intentional at agent/webhook error boundaries in
# this codebase (see app/agents/, app/routers/billing.py) rather than bugs.
ignore = ["BLE001"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Header", "fastapi.Body", "fastapi.File", "fastapi.Form"]

[tool.ruff.lint.per-file-ignores]
# SQLAlchemy relationship() targets are resolved by the mapper registry at
# runtime, not by Python name binding, so these forward-ref strings are not
# actually undefined.
"app/models/*.py" = ["F821"]
